<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Beyond Frame · 적용 화면</title><style>*{box-sizing:border-box}body{margin:0;background:#101216;color:#f5f5f7;font:16px system-ui;line-height:1.7}main{max-width:1120px;margin:auto;padding:50px 24px}h1{font-size:42px;letter-spacing:-2px;margin:0}p{color:#b8bbc4}img{width:100%;display:block;border-radius:14px;border:1px solid #ffffff20}figure{margin:32px 0}figcaption{margin:12px 2px;color:#b8bbc4}a{color:#aacbff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid figure{margin:12px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style><main><h1>beyond-frame</h1><p>영상의 색과 움직임을 화면 너머로.</p><p>확장 프로그램과 동일한 코드를 실제 공개 영상에 적용한 로컬 데모입니다. 유튜브 사이트에서 찍은 화면은 아닙니다.</p><figure><img src="screenshots/01-big-buck-bunny.jpg" alt="Big Buck Bunny 배경 확장 적용"><figcaption>Big Buck Bunny · 밝은 색감과 숲</figcaption></figure><figure><img src="screenshots/02-sintel.jpg" alt="Sintel 배경 확장 적용"><figcaption>Sintel · 설원과 넓은 화면비</figcaption></figure><figure><img src="screenshots/03-tears-of-steel.jpg" alt="Tears of Steel 배경 확장 적용"><figcaption>Tears of Steel · 어두운 실사 장면</figcaption></figure><h2>같은 프레임 · 적용 전후</h2><div class="grid"><figure><img src="screenshots/04-background-off.jpg" alt="배경 확장 끔"><figcaption>적용 전</figcaption></figure><figure><img src="screenshots/01-big-buck-bunny.jpg" alt="배경 확장 켬"><figcaption>적용 후</figcaption></figure></div><p>이미지 속 작품: Blender Foundation · CC BY 3.0. <a href="SCREENSHOT-CREDITS.md">작품별 출처와 라이선스</a></p></main></html>
